# نشر الأطلس على GitHub Pages (docs/LAUNCH_DECISIONS.md، القرار ق5).
# يعمل عند تحديث فرع launch وحده، أو بتشغيل يدوي. ولا يُنشر شيء قبل نجاح check:all ثم check:launch (شرط الإطلاق في CLAUDE.md).
name: نشر الأطلس

on:
  push:
    branches: [launch]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - name: الفحوص (check:all)
        run: npm run check:all
      - name: بوابة التراخيص (check:launch)
        run: npm run check:launch
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
