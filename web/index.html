<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الأطلس الشامل</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <style>
    :root { --bg: #f4efe6; --ink: #2a2620; --muted: #6b6356; --accent: #8a4b2a; --panel: #fffdf8; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #1d1a16; --ink: #ece6da; --muted: #a79d8c; --accent: #d89a72; --panel: #26221d; }
    }
    :root[data-theme="dark"] { --bg: #1d1a16; --ink: #ece6da; --muted: #a79d8c; --accent: #d89a72; --panel: #26221d; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel { position: absolute; top: 12px; inset-inline-start: 12px; max-width: min(360px, calc(100% - 24px)); background: var(--panel); padding: 14px 16px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.15); max-height: calc(100vh - 24px); overflow-y: auto; }
    #panel h1 { font-size: 18px; margin: 0 0 6px; }
    #panel p { margin: 4px 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
    .warn { color: var(--accent); font-weight: 600; }
    .eras { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .eras button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--ink); cursor: pointer; }
    .eras button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
    .claims-list { max-height: 260px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
    .claims-list .claim { border-top: 1px solid var(--accent); padding: 6px 0; }
    .claims-list .quote { color: var(--muted); font-style: italic; }
    .popup-name { font-weight: 700; font-size: 15px; }
    .popup-sub { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <aside id="panel">
    <h1>الأطلس الشامل</h1>
    <div class="eras" id="eras"></div>
    <p id="era-desc"></p>
    <p>طبقة السكان (تُعرض على الخريطة مع الحقبة المختارة):</p>
    <div class="eras" id="demo-eras"></div>
    <p id="demo-note"></p>
    <p class="warn" id="era-warn"></p>
    <p id="count"></p>
    <p>ادعاءات موثّقة (مسودة):</p>
    <div class="eras" id="claims-eras"></div>
    <div id="claims-list" class="claims-list"></div>
    <div class="eras"><button type="button" id="claim-map-btn" aria-pressed="false">عرض الادعاءات على الخريطة</button></div>
    <p>المصادر: Pleiades، ترخيص CC BY 3.0. السكان: Gapminder، ترخيص CC BY 4.0.</p>
  </aside>
  <script src="vendor/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
